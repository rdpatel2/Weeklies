name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m0-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify evaluation instrument and reproduce sample
        run: python -m unittest discover -s scripts/tests -v
      - name: Evaluate synthetic planning sessions
        id: m0
        shell: bash
        run: |
          status=0
          python scripts/eval_m0.py evals/m0/synthetic.csv --output artifacts/m0-result.json || status=$?
          # A negative hypothesis result is reportable evidence; an instrument error breaks CI.
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("artifacts/m0-result.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## M0 synthetic demonstration\n\n")
              summary.write(f"Hypothesis verdict: **{report['verdict']}**\n\n")
              summary.write(f"Pairs: {report['sample_size']}\n\n")
              summary.write(f"Median time reduction: {report['median_reduction']:.2%}\n\n")
              for method, rate in report["budget_success_rate"].items():
                  summary.write(f"{method.title()} complete plans within budget: {rate:.0%}\n\n")
              summary.write(f"Budget improvement: {report['budget_lift_percentage_points']:.1f} percentage points\n\n")
              summary.write(f"{report['interpretation']}\n\n")
              if report["verdict"] == "FAIL":
                  summary.write("See docs/m0.md for the synthetic review and next experiment.\n")
          PY
      - name: Upload M0 evidence and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-evaluation
          path: |
            artifacts/m0-result.json
            evals/m0/synthetic.csv
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: proj2
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir
          pip install pytest pytest-cov black ruff --no-cache-dir

      - name: Run tests with coverage
        working-directory: proj2
        run: |
          pytest --tb=short -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Check code formatting (Black)
        working-directory: proj2
        continue-on-error: true
        run: |
          black --check .

      - name: Lint code (Ruff)
        working-directory: proj2
        continue-on-error: true
        run: |
          ruff check .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./proj2/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate test badge
        if: always()
        working-directory: proj2
        run: |
          # Extract test results from pytest output
          PYTEST_OUTPUT=$(pytest --tb=short -v 2>&1 || true)
          PASSED=$(echo "$PYTEST_OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$PYTEST_OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")
          
          if [ "$FAILED" = "0" ] || [ -z "$FAILED" ]; then
            COLOR="success"
            MSG="$PASSED passing"
          else
            COLOR="critical"
            MSG="$PASSED/$((PASSED + FAILED)) passing"
          fi
          
          BADGE=$(printf '{ "schemaVersion": 1, "label": "tests", "message": "%s", "color": "%s" }' "$MSG" "$COLOR")
          echo "badge=${BADGE}" >> $GITHUB_OUTPUT

      - name: Update badge gist
        if: always()
        uses: actions/github-script@v7
        env:
          GIST_ID: 0ab63df1c29ad707ee2f0c5bdbf46383
          BADGE_FILE: tests-badge.json
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const gistId = process.env.GIST_ID;
            const file = process.env.BADGE_FILE;
            
            // Provide a default badge if generation failed
            const badge = {
              schemaVersion: 1,
              label: "tests",
              message: "tests completed",
              color: "success"
            };
            
            try {
              await github.rest.gists.update({
                gist_id: gistId,
                files: { [file]: { content: JSON.stringify(badge) } }
              });
            } catch (err) {
              console.log("Badge update failed (non-critical):", err.message);
            }
